<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Product preview card component</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="img" role="img" aria-label="Cart image"></div>
    <div class="info">

        <p class="perfume">PERFUME</p>

        <h1>Gabrielle Essence Eau De Parfum</h1>
        
        <p class="product-info">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>

        <div class="prices">
        <span class="price">$149.99</span>
        <span class="normal-price">$169.99</span>
    </div>
        
        <br>
        <button class="cart">
            <img class="icon-cart" src="./images/icon-cart.svg" alt="Icon cart">
            <p>  Add to Cart</p>
        </button>
    </div>

    </div>
</body>
</html>
